# GitHub Actions: авто-обновление подписок по cron'у.
#
# Пайплайн:
#   1. sync_sni_whitelist.py — обновляет data/sni_whitelist.txt
#      (~910 SNI-доменов, community-curated) для SNI-сортировки БС-первыми.
#   2. fetch_tg_subs.py — парсит t.me/s/happvpn (happ://crypt5/...) и
#      mifa.world (категории) -> data/tg_subs.txt.
#   3. refresh_subs.py — сбор URL'ов из data/sources.txt + tg_subs.txt +
#      data/saved_subs/* -> fetch -> parse -> dedup -> SNI-сортировка
#      -> TCP-ping ALL (фильтр мёртвых; БЕЗ сортирующего эффекта —
#      порядок входного списка сохраняется, latency только в лог:
#      пинг идёт с раннера GitHub, для юзера в РФ это шум) ->
#      known_good append (проверенные вручную конфиги) -> geo-rename
#      (косметика имён) -> split БС/ЧС -> dedup по серверу.
#   4. alive_test.py — sing-box/xray SOCKS5 + HTTP-пробы через прокси:
#      exit-IP (api.ipify.org) + заблокированные сервисы (ig/yt/tg).
#      Порог --max-latency-ms применяется к TTFB пробы exit-IP.
#      В лог пишутся фазы: connect / tls / ttfb / total.
#   5. subs.txt = base64(preload_bs.txt), subs_chs.txt = base64(preload_chs.txt)
#      -> git-auto-commit.
#
# Важно:
#   - latency-порог применяется к ОДНОЙ величине (TTFB exit-IP пробы),
#     поэтому в логе больше нет абсурда «2006ms -> DEAD, 5563ms -> ALIVE».
#   - Гео: цепочка api.ip.sb → ip-api.com → ipwho.is (гео — метаданные,
#     НЕ критерий жизни). Узлы «🌐 peppo» (гео неизвестно после всей цепочки
#     и нет флага в имени) отбрасываются: не дают предсказуемой страны выхода,
#     бесполезны для GEO-обхода и занимают слот в финальной подписке.
#   - Антифейк: --min-ping-ms 80 (CDN/PaaS: connect 10-50ms, прокси нет;
#     рабочие узлы по known_good 185-320ms) и --drop-cdn-ips (CDN IP =
#     фейк; проверено вручную по v2rayN) — ВКЛЮЧЕНЫ.
#   - Классификация БС/ЧС: гадайка по ключевым словам (wl/bl/white/black
#     в URL и теле подписки) — ВКЛЮЧЕНА по вердикту владельца (распределение
#     соответствует реальности). Явные секции sources.txt приоритетнее.
#   - Недоказанные эвристики (cross-dedup) по умолчанию ВЫКЛЮЧЕНЫ.
#     Список — в справке scripts/refresh_subs.py --help.
name: Refresh subs

on:
  schedule:
    # Каждые 3 часа (UTC): 0,3,6,9,12,15,18,21.
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    # Ручной запуск из вкладки Actions.
    inputs:
      with_ping:
        description: "TCP-ping фильтр (медленнее, чистит мёртвые)"
        type: boolean
        default: true
      sort_by_sni:
        description: "Сортировать БС-узлы первыми в финальном списке"
        type: boolean
        default: true
      vless_only:
        description: "Собирать ТОЛЬКО vless:// конфиги. Default OFF"
        type: boolean
        default: false
      drop_geo_fallback:
        description: "Отбрасывать '🌐 peppo' (гео неизвестно после цепочки ip.sb→ip-api→ipwho и нет флага в имени). Default ON"
        type: boolean
        default: true

# Чтобы параллельные запуски не затирали друг друга.
concurrency:
  group: refresh-subs
  cancel-in-progress: true

permissions:
  contents: write  # нужен для пуша коммита в main

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # 180 минут: запас для больших списков (TCP-ping ~200k узлов).
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-gha.txt
            scripts/refresh_subs.py
            scripts/fetch_tg_subs.py

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Sync community SNI whitelist
        # ~910 SNI-доменов из hxehex upstream — для сортировки БС-первыми.
        # CIDR-список НЕ качаем: в этом пайплайне он не используется.
        run: |
          python scripts/sync_sni_whitelist.py

      - name: Fetch dynamic Telegram + mifa.world subscriptions
        # t.me/s/happvpn (HTML) -> happ://crypt5/... ссылки;
        # mifa.world главная -> все категории (ursa, vless, bober, ...).
        # Результат: data/tg_subs.txt (мёрджится через --extra-sources-file).
        run: |
          python scripts/fetch_tg_subs.py \
            --channel happvpn \
            --output data/tg_subs.txt \
            --timeout 20.0
          echo "=== data/tg_subs.txt ==="
          cat data/tg_subs.txt 2>/dev/null || echo "(not generated — see logs above)"

      - name: Download sing-box + xray Linux binaries
        # sing-box — основной рантайм alive-test; xray — для raw/xhttp
        # транспорта (sing-box их не поддерживает).
        run: |
          mkdir -p bin
          echo "=== Downloading sing-box-linux-64 ==="
          SB_VERSION=v1.13.16
          SB_VERSION_NO_V=${SB_VERSION#v}
          curl -sSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${SB_VERSION}/sing-box-${SB_VERSION_NO_V}-linux-amd64.tar.gz"
          if ! file /tmp/sb.tar.gz | grep -q "gzip compressed"; then
            echo "FATAL: sing-box download is not gzip"
            exit 1
          fi
          tar -xzf /tmp/sb.tar.gz -C /tmp
          cp /tmp/sing-box-*/sing-box bin/sing-box
          chmod +x bin/sing-box
          bin/sing-box version
          echo "=== Downloading xray-linux-64 ==="
          XRAY_VERSION=v26.3.27
          curl -sSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/xray-linux-64.zip"
          unzip -o /tmp/xray.zip -d /tmp/xray
          cp /tmp/xray/xray bin/xray
          chmod +x bin/xray
          bin/xray version

      - name: Refresh subs (fetch + parse + dedup + ping + geo + split БС/ЧС)
        # known_good: mode=none — только append проверенных вручную конфигов.
        # --max-ping-ms не передаём: при --ping-timeout 1.5s он мёртв по
        # определению (connect дольше 1.5с уже убит таймаутом).
        env:
          SUBGEN_DEBUG: "1"
        run: |
          python scripts/refresh_subs.py \
            --sources-file data/sources.txt \
            --extra-sources-file data/tg_subs.txt \
            --output data/preload.txt \
            --report data/preload_report.json \
            --with-ping \
            --min-ping-ms 80 \
            --drop-cdn-ips \
            --guess-source-type \
            --ping-timeout 1.5 \
            --ping-workers 128 \
            --max-ping-nodes 0 \
            --fetch-timeout 25.0 \
            --sort-by-sni \
            --geo-rename \
            --geo-rename-workers 8 \
            --geo-rename-timeout 8.0 \
            --known-good data/known_good.txt \
            --known-good-mode none \
            --split-bs-chs \
            ${{ inputs.vless_only == true && '--vless-only' || '' }} \
            ${{ inputs.drop_geo_fallback != false && '--drop-geo-fallback' || '--no-drop-geo-fallback' }} \
            --max-servers 0

      - name: Alive-test (sing-box/xray SOCKS5 + HTTP-пробы — ВСЕ узлы)
        # --max-latency-ms применяется к TTFB пробы exit-IP (одна величина
        # для всех узлов). Фазы connect/tls/ttfb/total пишутся в лог и отчёт.
        run: |
          if [ ! -x bin/sing-box ]; then
            echo "[gha] sing-box not found — skipping alive-test"
            exit 0
          fi
          python scripts/alive_test.py \
            --input data/preload_bs.txt \
            --output data/preload_alive.txt \
            --report data/alive_test_report.json \
            --singbox-bin bin/sing-box \
            --xray-bin bin/xray \
            --source-map data/source_map.json \
            --max-nodes 0 \
            --workers 16 \
            --head-timeout 8 \
            --startup-timeout 5 \
            --max-latency-ms 2000
          if [ -s data/preload_alive.txt ]; then
            ALIVE_COUNT=$(($(wc -l < data/preload_alive.txt) - 1))
            echo "[gha] alive-test BS: $ALIVE_COUNT alive — replacing preload_bs.txt"
            cp data/preload_alive.txt data/preload_bs.txt
          else
            echo "[gha] alive-test BS: 0 alive — keeping original preload_bs.txt"
          fi
          if [ -s data/preload_chs.txt ]; then
            python scripts/alive_test.py \
              --input data/preload_chs.txt \
              --output data/preload_chs_alive.txt \
              --report data/alive_test_chs_report.json \
              --singbox-bin bin/sing-box \
              --xray-bin bin/xray \
              --source-map data/source_map.json \
              --max-nodes 0 \
              --workers 16 \
              --head-timeout 8 \
              --startup-timeout 5 \
              --max-latency-ms 2000
            if [ -s data/preload_chs_alive.txt ]; then
              cp data/preload_chs_alive.txt data/preload_chs.txt
            fi
          fi
          echo "[gha] generating subs.txt (БС alive-confirmed base64)..."
          cat data/preload_bs.txt | base64 -w 0 > subs.txt
          echo "[gha] subs.txt (БС): $(wc -c < subs.txt) bytes ($(wc -l < data/preload_bs.txt) configs)"
          echo "[gha] generating subs_chs.txt (ЧС alive-confirmed base64)..."
          cat data/preload_chs.txt | base64 -w 0 > subs_chs.txt
          echo "[gha] subs_chs.txt (ЧС): $(wc -c < subs_chs.txt) bytes ($(wc -l < data/preload_chs.txt) configs)"

      - name: Show stats
        if: always()
        run: |
          echo "=== preload.txt (first 5 nodes, plain text URLs) ==="
          head -n 5 data/preload.txt 2>/dev/null || true
          echo
          echo "=== subs.txt (base64 subscription — import into v2rayN/Happ/Karing) ==="
          if [ -f subs.txt ]; then
            echo "subs.txt size: $(wc -c < subs.txt) bytes"
            echo "configs in subs.txt: $(base64 -d subs.txt 2>/dev/null | wc -l)"
          else
            echo "subs.txt NOT generated"
          fi
          echo
          echo "=== preload_report.json ==="
          cat data/preload_report.json 2>/dev/null || true

      - name: Cleanup + force-add
        # cleanup удаляет устаревшие файлы; force-add нужен, потому что
        # .gitignore содержит data/* (без -f git не видит новые файлы).
        run: |
          # Устаревшие артефакты прошлых версий + больше не используемый CIDR-список.
          rm -f data/preload_speed.txt data/preload_working.txt \
                data/preload_report_full.json data/speedtest_report.json \
                data/cidr_whitelist.txt \
                subs_all.txt 2>/dev/null || true
          echo "[gha] cleaned up old artifacts"
          # Гарантируем существование subs_chs.txt (если split failed).
          if [ ! -f subs_chs.txt ]; then
            > subs_chs.txt
          fi
          # Force-add data/ файлы — .gitignore содержит data/*, без -f
          # git-auto-commit НЕ видит новые файлы.
          for f in data/tg_subs.txt data/preload_bs.txt data/preload_chs.txt \
                   data/preload.txt data/preload_report.json \
                   data/alive_test_report.json data/alive_test_chs_report.json \
                   data/source_map.json \
                   data/sni_whitelist.txt \
                   data/sni_whitelist_custom.txt data/known_good.txt \
                   data/sources.txt; do
            if [ -f "$f" ]; then
              git add -f "$f" 2>/dev/null || true
            fi
          done
          echo "[gha] force-added data/ files (bypass .gitignore data/* rule)"

      - name: Upload logs as artifacts
        # Логи/отчёты как GHA artifact (Actions -> Run -> Artifacts, 90 дней).
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gha-logs-${{ github.run_id }}
          path: |
            data/preload.txt
            data/preload_bs.txt
            data/preload_chs.txt
            data/preload_report.json
            data/alive_test_report.json
            data/alive_test_chs_report.json
            data/tg_subs.txt
            data/sni_whitelist.txt
            subs.txt
            subs_chs.txt

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh subs (preload + subs + report)"
          file_pattern: "data/ subs.txt subs_chs.txt"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
