# GitHub Actions: авто-обновление списков подписок на cron'е.
#
# Что делает (v48 — простой + peppo-имена, ~5-15 мин на прогон):
#   1. fetch_tg_subs.py: парсит t.me/s/happvpn (happ://crypt5/...) и
#      mifa.world главную (категории) → data/tg_subs.txt
#   2. refresh_subs.py: собирает URL'ы из data/sources.txt + data/tg_subs.txt
#      + data/saved_subs/* → fetch → parse → dedup → SNI sort (БС первыми)
#      → TCP-ping ALL (workers=64, timeout=1.5s) → pattern-score (canonical:
#      vless+reality / vless+tls+ws / trojan+tls+ws / hy2 / tuic)
#      → known_good append (23 verified configs юзера) → geo-rename:
#      "🇩🇪 DE peppo" через api.ip.sb/geoip (если fail — оригинальное имя)
#      → --max-servers 100 → data/preload.txt
#   3. cat preload.txt | base64 -w0 > subs.txt (готовая подписка для v2rayN/Happ/Karing)
#   4. git-auto-commit-action пушит preload.txt + subs.txt + report + whitelists
#
# Чего НЕТ в v48 (по просьбе юзера):
#   ❌ Speedtest (sing-box + Cloudflare 10MB) — отбрасывал РФ-узлы на Azure (гео-блок)
#   ❌ Full test (xray alive + blocked_services + tg_media + siberian)
#   ❌ Download sing-box/xray binaries (не нужны без speedtest/full_test)
#
# Что ЕСТЬ в v48 (по просьбе юзера):
#   ✅ Geo-rename — узлы получают "🇩🇪 DE peppo" формат (если страна определена).
#      Если api.ip.sb не смог определить страну (DNS-resolve fail для РФ-доменов
#      типа test-cdn-kkk.com) — оставляем ОРИГИНАЛЬНОЕ имя из подписки (например
#      "Франция 🇫🇷" из AetrisVPN). НЕ ставим "🏳 ?? peppo" — это было неузнаваемо.
#
# Когда запускать: см. on.schedule cron. По умолчанию — каждые 3 часа
# (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC).
# Можно вызвать вручную через Actions → Refresh subs → Run workflow.
name: Refresh subs

on:
  schedule:
    # v39: Каждые 3 часа (UTC): 0,3,6,9,12,15,18,21.
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    # Ручной запуск из вкладки Actions — удобно для отладки.
    inputs:
      with_ping:
        description: "TCP-ping фильтр (медленнее, чистит мёртвые)"
        type: boolean
        default: true
      sort_by_sni:
        description: "Сортировать БС-узлы первыми в финальном списке (внутри subs_bs.txt)"
        type: boolean
        default: true
      vless_only:
        description: "Собирать ТОЛЬКО vless:// конфиги (отсев trojan/ss/vmess/hy2/tuic). Default OFF"
        type: boolean
        default: false
      drop_geo_fallback:
        description: "Отбрасывать узлы с именем '🌐 peppo' (geo-rename не нашёл страну). Default ON"
        type: boolean
        default: true
      max_servers:
        description: "ФИНАЛЬНЫЙ лимит узлов. 100 = стандарт, 200 = щедро (default v49), 0 = без лимита"
        type: string
        default: "200"

# Чтобы не было параллельных запусков (старый коммит затрёт новый).
concurrency:
  group: refresh-subs
  cancel-in-progress: true

permissions:
  contents: write  # нужен для пуша коммита в main

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # v57: 180 минут (3 часа) — для огромных списков (200k узлов).
    # v56 упал на ping 197k узлов (workers=64, timeout=1.5с = 83 минуты).
    # GHA timeout 90 минут не хватило. Поднимаем до 180 + workers=128 (в 2× быстрее).
    # 200k × 1.5с / 128 workers ≈ 39 минут (запас 5×).
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-gha.txt
            scripts/refresh_subs.py
            scripts/fetch_tg_subs.py

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Sync community SNI + CIDR whitelist
        # Качаем ~910 SNI доменов + ~30k CIDR-подсетей из hxehex upstream.
        # Обновляется каждый раз (community-curated).
        run: |
          python scripts/sync_sni_whitelist.py --with-cidr

      - name: Fetch dynamic Telegram + mifa.world subscriptions
        # v39: Парсим t.me/s/happvpn (HTML) — ищем happ://crypt5/... в последнем
        # посту. Парсим mifa.world главную — извлекаем все категории (ursa,
        # vless, bober, ronin, hysteria, ...) и формируем URL mifa.world/<cat>.
        # Результат: data/tg_subs.txt — мёрджится к data/sources.txt через
        # --extra-sources-file на следующем шаге.
        run: |
          python scripts/fetch_tg_subs.py \
            --channel happvpn \
            --output data/tg_subs.txt \
            --timeout 20.0
          echo "=== data/tg_subs.txt ==="
          cat data/tg_subs.txt 2>/dev/null || echo "(not generated — see logs above)"

      - name: Download sing-box Linux binary (v64)
        # v64: sing-box нужен для alive_test.py — быстрый alive-test
        # (HTTP HEAD через SOCKS5 к gstatic.com/generate_204).
        # Отбрасывает CDN/Railway/Vercel/фейк — оставляет только РЕАЛЬНЫЕ VPN.
        run: |
          mkdir -p bin
          echo "=== Downloading sing-box-linux-64 ==="
          SB_VERSION=v1.13.16
          SB_VERSION_NO_V=${SB_VERSION#v}
          curl -sSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${SB_VERSION}/sing-box-${SB_VERSION_NO_V}-linux-amd64.tar.gz"
          if ! file /tmp/sb.tar.gz | grep -q "gzip compressed"; then
            echo "FATAL: sing-box download is not gzip"
            exit 1
          fi
          tar -xzf /tmp/sb.tar.gz -C /tmp
          cp /tmp/sing-box-*/sing-box bin/sing-box
          chmod +x bin/sing-box
          bin/sing-box version

      - name: Refresh subs (fetch + parse + dedup + ping + canonical-stack + geo-rename + split БС/ЧС)
        # v49: Упростил как у Pizduk/Aetris/Mifa — НЕТ pattern-score.
        # Просто canonical-stack filter (vless+reality / vless+tls+ws /
        # trojan+tls+ws / vmess+tls+ws / hy2 / tuic). Pattern-score отсекал
        # рабочие конфиги, оставляя только похожие на known_good (которые
        # могли умереть за пару дней).
        # v49: Разделяем финал на 2 списка по SNI-категории:
        #   preload_bs.txt  — БС + серый + фейк + none → для мобилки РФ
        #   preload_chs.txt — только ЧС SNI → для WiFi / не-RU
        # subs.txt (общий base64) = preload_bs.txt (т.к. юзер в РФ на мобилке).
        env:
          SUBGEN_DEBUG: "1"
        run: |
          python scripts/refresh_subs.py \
            --sources-file data/sources.txt \
            --extra-sources-file data/tg_subs.txt \
            --output data/preload.txt \
            --report data/preload_report.json \
            --with-ping \
            --ping-timeout 1.5 \
            --ping-workers 128 \
            --max-ping-nodes 0 \
            --max-ping-ms 2000 \
            --fetch-timeout 25.0 \
            --sort-by-sni \
            --geo-rename \
            --geo-rename-workers 8 \
            --geo-rename-timeout 8.0 \
            --known-good data/known_good.txt \
            --known-good-mode none \
            --no-pattern-score \
            --allow-canonical-stack \
            --split-bs-chs \
            ${{ inputs.vless_only == true && '--vless-only' || '' }} \
            ${{ inputs.drop_geo_fallback == true && '--drop-geo-fallback' || '--no-drop-geo-fallback' }} \
            --max-servers ${{ inputs.max_servers || '200' }}
      - name: Alive-test (sing-box SOCKS5 + HTTP HEAD — отсеивает CDN/фейк)
        # v64: Для КАЖДОГО узла из preload_bs.txt — запускаем sing-box,
        # делаем HTTP HEAD к gstatic.com/generate_204 через SOCKS5.
        # Если HTTP 204 → узел ЖИВОЙ (прокси работает).
        # Если 403/TLS failure/timeout → МЁРТВЫЙ (отбрасываем).
        # Это ОТЛИЧАЕТ реальные VPN от CDN/Railway/Vercel/фейк.
        # Скорость: ~200 узлов × 3с / 8 workers ≈ 75 секунд.
        run: |
          if [ ! -x bin/sing-box ]; then
            echo "[gha] sing-box not found — skipping alive-test"
            exit 0
          fi
          python scripts/alive_test.py \
            --input data/preload_bs.txt \
            --output data/preload_alive.txt \
            --report data/alive_test_report.json \
            --singbox-bin bin/sing-box \
            --max-nodes 200 \
            --workers 8 \
            --head-timeout 5 \
            --startup-timeout 5
          # Если alive-test нашёл живые узлы — заменяем preload_bs.txt.
          if [ -s data/preload_alive.txt ]; then
            ALIVE_COUNT=$(($(wc -l < data/preload_alive.txt) - 1))
            echo "[gha] alive-test: $ALIVE_COUNT confirmed alive — replacing preload_bs.txt"
            cp data/preload_alive.txt data/preload_bs.txt
          else
            echo "[gha] alive-test: 0 alive — keeping original preload_bs.txt"
          fi
          # Также тестируем ЧС.
          if [ -s data/preload_chs.txt ]; then
            python scripts/alive_test.py \
              --input data/preload_chs.txt \
              --output data/preload_chs_alive.txt \
              --report data/alive_test_chs_report.json \
              --singbox-bin bin/sing-box \
              --max-nodes 200 \
              --workers 8 \
              --head-timeout 5 \
              --startup-timeout 5
            if [ -s data/preload_chs_alive.txt ]; then
              cp data/preload_chs_alive.txt data/preload_chs.txt
            fi
          fi
          # Генерируем subs.txt = preload_bs.txt (alive-confirmed БС).
          echo "[gha] generating subs.txt (БС alive-confirmed base64)..."
          cat data/preload_bs.txt | base64 -w 0 > subs.txt
          echo "[gha] subs.txt (БС): $(wc -c < subs.txt) bytes ($(wc -l < data/preload_bs.txt) configs)"
          # subs_chs.txt = preload_chs.txt (alive-confirmed ЧС).
          echo "[gha] generating subs_chs.txt (ЧС alive-confirmed base64)..."
          cat data/preload_chs.txt | base64 -w 0 > subs_chs.txt
          echo "[gha] subs_chs.txt (ЧС): $(wc -c < subs_chs.txt) bytes ($(wc -l < data/preload_chs.txt) configs)"

      - name: Show stats
        if: always()
        run: |
          echo "=== preload.txt (first 5 nodes, plain text URLs) ==="
          head -n 5 data/preload.txt 2>/dev/null || true
          echo
          echo "=== subs.txt (base64 subscription — import into v2rayN/Happ/Karing) ==="
          if [ -f subs.txt ]; then
            echo "subs.txt size: $(wc -c < subs.txt) bytes"
            echo "configs in subs.txt: $(base64 -d subs.txt 2>/dev/null | wc -l)"
          else
            echo "subs.txt NOT generated"
          fi
          echo
          echo "=== preload_report.json ==="
          cat data/preload_report.json 2>/dev/null || true

      - name: Cleanup + force-add (v61)
        # v61: ВЕРНУЛ cleanup + force-add (юзер: "если нужно то делай").
        # cleanup удаляет устаревшие файлы (preload_speed.txt и т.д.)
        # force-add нужен — .gitignore содержит data/*, без git add -f
        # новые файлы (preload_bs.txt, preload_chs.txt, tg_subs.txt)
        # НЕ коммитятся git-auto-commit-action'ом.
        run: |
          # Удаляем устаревшие файлы от прошлых версий.
          rm -f data/preload_speed.txt data/preload_working.txt \
                data/preload_report_full.json data/speedtest_report.json \
                subs_all.txt 2>/dev/null || true
          echo "[gha] cleaned up old artifacts"
          # Гарантируем существование subs_chs.txt (если split failed).
          if [ ! -f subs_chs.txt ]; then
            > subs_chs.txt
          fi
          # Force-add data/ файлы — .gitignore содержит data/*, без -f
          # git-auto-commit НЕ видит preload_bs.txt, preload_chs.txt, tg_subs.txt.
          for f in data/tg_subs.txt data/preload_bs.txt data/preload_chs.txt \
                   data/preload.txt data/preload_report.json \
                   data/sni_whitelist.txt data/cidr_whitelist.txt \
                   data/sni_whitelist_custom.txt data/known_good.txt \
                   data/sources.txt; do
            if [ -f "$f" ]; then
              git add -f "$f" 2>/dev/null || true
            fi
          done
          echo "[gha] force-added data/ files (bypass .gitignore data/* rule)"

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh subs (preload.txt + subs.txt + SNI/CIDR whitelist + report)"
          # v51: file_pattern включает subs_chs.txt (subs_bs.txt НЕ создаём —
          # subs.txt уже = base64(preload_bs.txt), а subs_chs.txt = base64(preload_chs.txt)).
          # v58: Убрал subs_bs.txt из pattern — он НЕ создаётся, и git-auto-commit
          # падал с "fatal: pathspec 'subs_bs.txt' did not match any files".
          file_pattern: "data/ subs.txt subs_chs.txt"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
