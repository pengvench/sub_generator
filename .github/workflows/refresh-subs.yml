# GitHub Actions: авто-обновление списков подписок на cron'е.
#
# Что делает (v48 — простой + peppo-имена, ~5-15 мин на прогон):
#   1. fetch_tg_subs.py: парсит t.me/s/happvpn (happ://crypt5/...) и
#      mifa.world главную (категории) → data/tg_subs.txt
#   2. refresh_subs.py: собирает URL'ы из data/sources.txt + data/tg_subs.txt
#      + data/saved_subs/* → fetch → parse → dedup → SNI sort (БС первыми)
#      → TCP-ping ALL (workers=64, timeout=1.5s) → pattern-score (canonical:
#      vless+reality / vless+tls+ws / trojan+tls+ws / hy2 / tuic)
#      → known_good append (23 verified configs юзера) → geo-rename:
#      "🇩🇪 DE peppo" через api.ip.sb/geoip (если fail — оригинальное имя)
#      → --max-servers 100 → data/preload.txt
#   3. cat preload.txt | base64 -w0 > subs.txt (готовая подписка для v2rayN/Happ/Karing)
#   4. git-auto-commit-action пушит preload.txt + subs.txt + report + whitelists
#
# Чего НЕТ в v48 (по просьбе юзера):
#   ❌ Speedtest (sing-box + Cloudflare 10MB) — отбрасывал РФ-узлы на Azure (гео-блок)
#   ❌ Full test (xray alive + blocked_services + tg_media + siberian)
#   ❌ Download sing-box/xray binaries (не нужны без speedtest/full_test)
#
# Что ЕСТЬ в v48 (по просьбе юзера):
#   ✅ Geo-rename — узлы получают "🇩🇪 DE peppo" формат (если страна определена).
#      Если api.ip.sb не смог определить страну (DNS-resolve fail для РФ-доменов
#      типа test-cdn-kkk.com) — оставляем ОРИГИНАЛЬНОЕ имя из подписки (например
#      "Франция 🇫🇷" из AetrisVPN). НЕ ставим "🏳 ?? peppo" — это было неузнаваемо.
#
# Когда запускать: см. on.schedule cron. По умолчанию — каждые 3 часа
# (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC).
# Можно вызвать вручную через Actions → Refresh subs → Run workflow.
name: Refresh subs

on:
  schedule:
    # v39: Каждые 3 часа (UTC): 0,3,6,9,12,15,18,21.
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    # Ручной запуск из вкладки Actions — удобно для отладки.
    inputs:
      with_ping:
        description: "TCP-ping фильтр (медленнее, чистит мёртвые)"
        type: boolean
        default: true
      tspu_sim:
        description: "TSPU-эмулятор (отбрасывает ЧС SNI). Default OFF — собираем и БС, и ЧС"
        type: boolean
        default: false
      sort_by_sni:
        description: "Сортировать БС-узлы первыми в финальном списке (НЕ отбрасывает ЧС)"
        type: boolean
        default: true
      max_servers:
        description: "ФИНАЛЬНЫЙ лимит узлов. 100 = стандарт, 200 = щедро (default v49), 0 = без лимита"
        type: string
        default: "200"

# Чтобы не было параллельных запусков (старый коммит затрёт новый).
concurrency:
  group: refresh-subs
  cancel-in-progress: true

permissions:
  contents: write  # нужен для пуша коммита в main

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # v47: 60 минут хватит (без speedtest/full_test прогон занимает ~5-15 мин).
    # 200k узлов × 1.5с / 64 workers ≈ 78 минут — пинг самый долгий этап.
    # На случай огромных списков — поднят до 90 мин.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-gha.txt
            scripts/refresh_subs.py
            scripts/fetch_tg_subs.py

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Sync community SNI + CIDR whitelist
        # Качаем ~910 SNI доменов + ~30k CIDR-подсетей из hxehex upstream.
        # Обновляется каждый раз (community-curated).
        run: |
          python scripts/sync_sni_whitelist.py --with-cidr

      - name: Fetch dynamic Telegram + mifa.world subscriptions
        # v39: Парсим t.me/s/happvpn (HTML) — ищем happ://crypt5/... в последнем
        # посту. Парсим mifa.world главную — извлекаем все категории (ursa,
        # vless, bober, ronin, hysteria, ...) и формируем URL mifa.world/<cat>.
        # Результат: data/tg_subs.txt — мёрджится к data/sources.txt через
        # --extra-sources-file на следующем шаге.
        run: |
          python scripts/fetch_tg_subs.py \
            --channel happvpn \
            --output data/tg_subs.txt \
            --timeout 20.0
          echo "=== data/tg_subs.txt ==="
          cat data/tg_subs.txt 2>/dev/null || echo "(not generated — see logs above)"

      - name: Refresh subs (fetch + parse + dedup + ping + canonical-stack + geo-rename + split БС/ЧС)
        # v49: Упростил как у Pizduk/Aetris/Mifa — НЕТ pattern-score.
        # Просто canonical-stack filter (vless+reality / vless+tls+ws /
        # trojan+tls+ws / vmess+tls+ws / hy2 / tuic). Pattern-score отсекал
        # рабочие конфиги, оставляя только похожие на known_good (которые
        # могли умереть за пару дней).
        # v49: Разделяем финал на 2 списка по SNI-категории:
        #   preload_bs.txt  — БС + серый + фейк + none → для мобилки РФ
        #   preload_chs.txt — только ЧС SNI → для WiFi / не-RU
        # subs.txt (общий base64) = preload_bs.txt (т.к. юзер в РФ на мобилке).
        env:
          SUBGEN_DEBUG: "1"
        run: |
          python scripts/refresh_subs.py \
            --sources-file data/sources.txt \
            --extra-sources-file data/tg_subs.txt \
            --output data/preload.txt \
            --report data/preload_report.json \
            --with-ping \
            --ping-timeout 1.5 \
            --ping-workers 64 \
            --max-ping-nodes 0 \
            --max-ping-ms 2000 \
            --fetch-timeout 25.0 \
            --sort-by-sni \
            --geo-rename \
            --geo-rename-workers 8 \
            --geo-rename-timeout 8.0 \
            --known-good data/known_good.txt \
            --known-good-mode none \
            --no-pattern-score \
            --allow-canonical-stack \
            --split-bs-chs \
            ${{ inputs.tspu_sim == true && '--tspu-sim' || '' }} \
            --max-servers ${{ inputs.max_servers || '200' }}
          # Генерируем subs.txt = preload_bs.txt (БС для мобилки РФ).
          echo "[gha] generating subs.txt (БС base64)..."
          cat data/preload_bs.txt | base64 -w 0 > subs.txt
          echo "[gha] subs.txt (БС): $(wc -c < subs.txt) bytes ($(wc -l < data/preload_bs.txt) configs)"
          # subs_chs.txt = preload_chs.txt (ЧС для WiFi/не-RU).
          echo "[gha] generating subs_chs.txt (ЧС base64)..."
          cat data/preload_chs.txt | base64 -w 0 > subs_chs.txt
          echo "[gha] subs_chs.txt (ЧС): $(wc -c < subs_chs.txt) bytes ($(wc -l < data/preload_chs.txt) configs)"

      - name: Show stats
        if: always()
        run: |
          echo "=== preload.txt (first 5 nodes, plain text URLs) ==="
          head -n 5 data/preload.txt 2>/dev/null || true
          echo
          echo "=== subs.txt (base64 subscription — import into v2rayN/Happ/Karing) ==="
          if [ -f subs.txt ]; then
            echo "subs.txt size: $(wc -c < subs.txt) bytes"
            echo "configs in subs.txt: $(base64 -d subs.txt 2>/dev/null | wc -l)"
          else
            echo "subs.txt NOT generated"
          fi
          echo
          echo "=== preload_report.json ==="
          cat data/preload_report.json 2>/dev/null || true

      - name: Cleanup old artifacts (v47)
        # v47: Удаляем устаревшие файлы от прошлых версий (v40-v45):
        # - preload_speed.txt (speedtest output)
        # - preload_working.txt (full_test output)
        # - preload_report_full.json (full_test report)
        # - speedtest_report.json (speedtest report)
        # v49b: Удаляем subs_all.txt (юзер сказал убрать — только ЧС и БС).
        # Эти файлы больше не генерируются, но могут остаться в репо.
        # Удаляем, чтобы git-auto-commit не упал на "no changes".
        run: |
          rm -f data/preload_speed.txt data/preload_working.txt \
                data/preload_report_full.json data/speedtest_report.json \
                subs_all.txt 2>/dev/null || true
          echo "[gha] cleaned up old artifacts (v47+, v49b: subs_all.txt)"
          # v48c: Force-add data/tg_subs.txt — иначе git-auto-commit-action
          # НЕ видит его (.gitignore содержит data/*). Даже после добавления
          # исключения в .gitignore, нужен git add -f для первого коммита.
          if [ -f data/tg_subs.txt ]; then
            git add -f data/tg_subs.txt 2>/dev/null || true
            echo "[gha] force-added data/tg_subs.txt"
          fi

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh subs (preload.txt + subs.txt + SNI/CIDR whitelist + report)"
          # v51: file_pattern включает subs_bs.txt и subs_chs.txt — РАНЬШЕ они
          # НЕ коммитились (был только "data/ subs.txt"). Теперь git-auto-commit
          # видит и пушит их в репо.
          file_pattern: "data/ subs.txt subs_bs.txt subs_chs.txt"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
